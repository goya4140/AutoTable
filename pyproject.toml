[project]
name = "paper-table"
version = "0.1.0"
description = "Code-first generation and evaluation of publication-ready academic tables"
requires-python = ">=3.10"
dependencies = ["pypdfium2>=4.30", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
